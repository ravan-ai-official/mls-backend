# Optional: Cloud Build config so you can `gcloud builds submit` instead of
# building locally. Free tier is 120 build-minutes/day. Not required — local
# build + push works and uses zero GCP build quota.
#
# Usage:
#   gcloud builds submit --config cloudbuild.yaml \
#       --substitutions=_REGION=us-central1,_REPO=mls,_IMAGE=mls-backend
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - "--tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:$SHORT_SHA"
      - "--tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest"
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - "--all-tags"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}"

images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:$SHORT_SHA"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest"

substitutions:
  _REGION: us-central1
  _REPO: mls
  _IMAGE: mls-backend

options:
  logging: CLOUD_LOGGING_ONLY
