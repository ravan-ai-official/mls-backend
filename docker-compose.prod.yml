# Production stack for mls-backend on a single GCE VM.
# Database: Cloud SQL (managed Postgres) via Auth Proxy sidecar.
# Target: 100 concurrent users on an e2-medium (2 vCPU, 4 GB).
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Services:
#   cloudsql-proxy - Secure tunnel to Cloud SQL (auth via VM service account).
#   backend        - Django (gunicorn) behind Caddy.
#   worker         - Celery worker (same image, different command).
#   beat           - Celery beat scheduler (gated by *_BEAT_ENABLED env vars).
#   redis          - Broker + cache (persistent AOF volume).
#   caddy          - TLS termination + reverse proxy; auto-renews Let's Encrypt.

services:
  cloudsql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14
    restart: unless-stopped
    # Listens inside the compose network only; backend reaches it at
    # cloudsql-proxy:5432. Auth uses the VM's attached service account —
    # no JSON key file, no DB password in env.
    command:
      - --address=0.0.0.0
      - --port=5432
      - ${CLOUD_SQL_INSTANCE}
    expose:
      - "5432"
    healthcheck:
      test: ["CMD", "/cloud-sql-proxy", "--health-check", "--http-port=9090"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 320M

  backend:
    image: ${IMAGE}
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      cloudsql-proxy:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          # 4 gunicorn workers * ~200 MB each + overhead
          memory: 1200M

  worker:
    image: ${IMAGE}
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      cloudsql-proxy:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "backend", "worker", "-l", "info", "--concurrency=${CELERY_CONCURRENCY:-2}"]
    deploy:
      resources:
        limits:
          memory: 400M

  beat:
    image: ${IMAGE}
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      cloudsql-proxy:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "backend", "beat", "-l", "info"]
    deploy:
      resources:
        limits:
          memory: 200M

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  redis-data:
  caddy-data:
  caddy-config:
